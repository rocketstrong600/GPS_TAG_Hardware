[package]
name = "gps-tag"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32f412rg", "time-driver-tim4", "memory-x", "exti", "chrono"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-futures = { version = "0.1.2" }

embassy-net-ppp = { version = "0.3.0", features = ["defmt"] }
embassy-net = { version = "0.9.1", features = ["defmt", "tcp", "dhcpv4", "dns", "medium-ethernet", "medium-ip"] }

smoltcp = { version = "0.13.1", default-features = false, features = [
    "dns-max-server-count-4",
] }

reqwless = { version = "0.13.0", default-features = false, features = [
    "embedded-tls",
] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"

cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"

panic-probe = { version = "1.0.0", features = ["print-defmt"] }
libm = "0.2.15"
heapless = { version = "0.9.2", default-features = false }
atat = { version = "0.25.0", features = ["defmt", "heapless"] }
static_cell = "2.1.1"
embedded-io-async = "0.7.0"
embedded-io = "0.7.1"


[profile.dev]
opt-level = "s"

[profile.release]
debug = 2
opt-level = "s"

[[bin]]
name = "gps-tag"
test = false
bench = false
