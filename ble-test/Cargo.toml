[workspace]

[package]
name = "ble-test"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-nrf = { version = "0.11.0", features = ["defmt", "nrf52832", "time-driver-rtc1", "gpiote", "nfc-pins-as-gpio"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }

nrf-mpsl = { version = "0.4.0", features = ["defmt", "nrf52832"] }
nrf-sdc = { version = "0.4.0", features = ["defmt", "nrf52832", "peripheral"] }
trouble-host = { version = "0.8.0", default-features = false, features = ["defmt", "peripheral", "gatt", "derive", "default-packet-pool"] }

defmt = "1.2.0"
defmt-rtt = "1.3.1"
static_cell = "2.1.1"

cortex-m = { version = "0.7.10", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.7"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[[bin]]
name = "ble-test"
test = false
bench = false
