[package]
name = "gps-tag-drivers"
version = "0.1.0"
edition = "2024"
description = "Hardware drivers and board support package for the STM32F412RG GPS Tag (EC21-AU, BMI160, ST25DV16K, SoftI2C, PWM buzzer)"

[dependencies]
embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32f412rg", "time-driver-tim4", "memory-x", "exti", "chrono"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-futures = { version = "0.1.2" }

embassy-net-ppp = { version = "0.3.0", features = ["defmt"] }
embassy-net = { version = "0.9.1", features = ["defmt", "tcp", "dhcpv4", "dns", "medium-ethernet", "medium-ip"] }
reqwless = { version = "0.14.0", default-features = false, features = ["embedded-tls"] }
# Required by embedded-tls 0.18.0 (missing heapless feature on its der dependency).
der = { version = "0.8", default-features = false, features = ["heapless"] }

smoltcp = { version = "0.13.1", default-features = false, features = [
    "dns-max-server-count-4",
] }

defmt = "1.2.0"
cortex-m = { version = "0.7.10", features = ["inline-asm", "critical-section-single-core"] }
libm = "0.2.16"
heapless = { version = "0.9.4", default-features = false }
atat = { version = "0.25.0", features = ["defmt", "heapless"] }
static_cell = "2.1.1"
embedded-hal = "1.0.0"
embedded-io-async = "0.7.0"
embedded-io = "0.7.1"

[dev-dependencies]
cortex-m-rt = "0.7.5"
defmt-rtt = "1.2.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[lib]
test = false
doctest = false
bench = false
