[workspace]

[package]
name = "ble-boot"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.10", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.7"
panic-halt = "1.0.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[[bin]]
name = "ble-boot"
test = false
bench = false
